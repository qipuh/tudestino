# ==============================================
# phpMyAdmin - Solo en .pe
# ==============================================

# Redirigir HTTP a HTTPS para phpMyAdmin
server {
    listen 80;
    server_name db.tudestino.pe;

    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# phpMyAdmin con SSL
server {
    listen 443 ssl http2;
    server_name db.tudestino.pe;

    # SSL - Certbot configurará estos automáticamente
    # ssl_certificate /etc/letsencrypt/live/db.tudestino.pe/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/db.tudestino.pe/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/phpmyadmin;
    index index.php;

    # Logs
    access_log /var/log/tudestino/phpmyadmin-access.log;
    error_log /var/log/tudestino/phpmyadmin-error.log;

    # PHP
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;  # Ajustar versión de PHP según instalación
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Seguridad adicional para phpMyAdmin
    location ~ ^/(libraries|setup|sql|templates)/ {
        deny all;
    }

    # Negar acceso a archivos ocultos
    location ~ /\. {
        deny all;
    }

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 100M;
}
