# Configuración de Nginx para TuDestino
# Dominios: tudestino.pe y tudestino.lat (AMBOS ACTIVOS)
# SSL Certificates separados por dominio

# ==============================================
# API - tudestino.pe
# ==============================================

server {
    listen 80;
    server_name api.tudestino.pe;

    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.tudestino.pe;

    ssl_certificate /etc/letsencrypt/live/api.tudestino.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tudestino.pe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/tudestino/api-access.log combined;
    error_log /var/log/tudestino/api-error.log;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /uploads {
        alias /var/www/tudestino/uploads;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 10M;
}

