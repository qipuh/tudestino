# Configuración de Nginx para TuDestino
# Ubicación: /etc/nginx/sites-available/tudestino
#
# Instrucciones:
# 1. Copiar este archivo al servidor: sudo nano /etc/nginx/sites-available/tudestino
# 2. REEMPLAZAR "tudestino.com" con tu dominio real
# 3. Crear symlink: sudo ln -s /etc/nginx/sites-available/tudestino /etc/nginx/sites-enabled/
# 4. Verificar configuración: sudo nginx -t
# 5. Recargar Nginx: sudo systemctl reload nginx
# 6. Obtener certificado SSL: sudo certbot --nginx -d tudestino.com -d www.tudestino.com -d api.tudestino.com -d admin.tudestino.com

# Redirigir HTTP a HTTPS para API
server {
    listen 80;
    server_name api.tudestino.com;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# API - Backend con Node.js
server {
    listen 443 ssl http2;
    server_name api.tudestino.com;

    # SSL configurado por Certbot
    # ssl_certificate /etc/letsencrypt/live/api.tudestino.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.tudestino.com/privkey.pem;

    # Logs
    access_log /var/log/tudestino/api-access.log;
    error_log /var/log/tudestino/api-error.log;

    # Proxy al backend Node.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Archivos subidos
    location /uploads {
        alias /var/www/tudestino/uploads;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Límites
    client_max_body_size 10M;
}

# Redirigir HTTP a HTTPS para Web
server {
    listen 80;
    server_name tudestino.com www.tudestino.com;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Web Frontend - SPA
server {
    listen 443 ssl http2;
    server_name tudestino.com www.tudestino.com;

    # SSL configurado por Certbot
    # ssl_certificate /etc/letsencrypt/live/tudestino.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tudestino.com/privkey.pem;

    root /var/www/tudestino/apps/web/dist;
    index index.html;

    # Logs
    access_log /var/log/tudestino/web-access.log;
    error_log /var/log/tudestino/web-error.log;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # SPA - Todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# Redirigir HTTP a HTTPS para Admin
