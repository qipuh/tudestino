name: tudestino_mobile
description: TuDestino Mobile App - Flutter

publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  ionicons: ^0.2.2

  # State Management
  provider: ^6.1.1
  get_it: ^7.6.4

  # Navigation
  go_router: ^13.0.0

  # Network
  http: ^1.1.2
  dio: ^5.4.0
  webview_flutter: ^4.7.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Images & Video
  cached_network_image: ^3.3.1
  video_player: ^2.8.2
  chewie: ^1.7.5

  # Maps & Location
  flutter_map: ^8.1.1
  flutter_map_tile_caching: ^10.1.1
  connectivity_plus: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Rutas GPS en background
  flutter_foreground_task: ^6.5.0
  permission_handler: ^11.3.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.5

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Calendar
  table_calendar: ^3.0.9

  # Utils
  intl: ^0.20.2
  timeago: ^3.6.1
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icono.png"
  adaptive_icon_background: "#014FA4"
  adaptive_icon_foreground: "assets/images/icono_foreground.png"
