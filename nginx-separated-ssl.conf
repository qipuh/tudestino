# ==============================================
# phpMyAdmin - db.tudestino.pe
# ==============================================

server {
    listen 80;
    server_name db.tudestino.pe;

    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name db.tudestino.pe;

    ssl_certificate /etc/letsencrypt/live/db.tudestino.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/db.tudestino.pe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/phpmyadmin;
    index index.php;

    access_log /var/log/tudestino/phpmyadmin-access.log;
    error_log /var/log/tudestino/phpmyadmin-error.log;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(libraries|setup|sql|templates)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 100M;
}
